<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="512" viewBox="0 0 1536 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1726"/>
      <stop offset="1" stop-color="#172a42"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2a3d57"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1536" height="512" fill="url(#bg)"/>
  <rect width="1536" height="512" fill="url(#dots)" opacity="0.6"/>
  <rect x="0" y="496" width="1536" height="16" fill="#2dd4bf" opacity="0.18"/>

  <!-- title block -->
  <rect x="80" y="150" width="56" height="6" rx="3" fill="#f5b041"/>
  <text x="76" y="252" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#e6edf3" letter-spacing="-1">githubbot-core</text>
  <text x="80" y="306" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#94a3b8">Neutral GitHub maintenance core</text>
  <!-- small chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#cbd5e1">
    <rect x="80" y="344" width="96" height="34" rx="17" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="128" y="367" text-anchor="middle">triage</text>
    <rect x="188" y="344" width="96" height="34" rx="17" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="236" y="367" text-anchor="middle">reports</text>
    <rect x="296" y="344" width="96" height="34" rx="17" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="344" y="367" text-anchor="middle">receipts</text>
  </g>

  <!-- floor shadow -->
  <ellipse cx="1060" cy="440" rx="420" ry="16" fill="#000" opacity="0.25"/>

  <!-- robot -->
  <g>
    <ellipse cx="740" cy="436" rx="56" ry="9" fill="#000" opacity="0.3"/>
    <!-- antenna -->
    <line x1="740" y1="196" x2="740" y2="170" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="740" cy="164" r="8" fill="#f5b041"/>
    <!-- head -->
    <rect x="690" y="196" width="100" height="76" rx="18" fill="#cbd5e1"/>
    <rect x="702" y="210" width="76" height="46" rx="12" fill="#0f1b2d"/>
    <circle cx="724" cy="233" r="8" fill="#2dd4bf"/>
    <circle cx="756" cy="233" r="8" fill="#2dd4bf"/>
    <rect x="682" y="222" width="8" height="22" rx="3" fill="#94a3b8"/>
    <rect x="790" y="222" width="8" height="22" rx="3" fill="#94a3b8"/>
    <!-- neck -->
    <rect x="730" y="272" width="20" height="12" fill="#94a3b8"/>
    <!-- body -->
    <rect x="686" y="284" width="108" height="104" rx="20" fill="#e2e8f0"/>
    <rect x="708" y="304" width="64" height="40" rx="8" fill="#0f1b2d"/>
    <rect x="716" y="314" width="30" height="6" rx="3" fill="#2dd4bf"/>
    <rect x="716" y="326" width="44" height="6" rx="3" fill="#f5b041" opacity="0.9"/>
    <circle cx="740" cy="366" r="9" fill="#2dd4bf" opacity="0.85"/>
    <!-- left arm -->
    <path d="M686 304 Q660 330 668 368" fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
    <!-- right arm holding wrench toward preview pane -->
    <path d="M794 304 Q826 290 846 268" fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
    <g transform="rotate(-40 852 262)">
      <rect x="846" y="232" width="12" height="44" rx="5" fill="#f5b041"/>
      <circle cx="852" cy="230" r="13" fill="#f5b041"/>
      <rect x="847" y="214" width="10" height="16" fill="#172a42"/>
    </g>
    <!-- wheels / base -->
    <rect x="700" y="388" width="80" height="22" rx="6" fill="#94a3b8"/>
    <circle cx="716" cy="418" r="14" fill="#334155"/>
    <circle cx="716" cy="418" r="5" fill="#94a3b8"/>
    <circle cx="764" cy="418" r="14" fill="#334155"/>
    <circle cx="764" cy="418" r="5" fill="#94a3b8"/>
  </g>

  <!-- PREVIEW pane (dashed, ghosted) -->
  <g>
    <rect x="870" y="110" width="230" height="300" rx="16" fill="#2dd4bf" fill-opacity="0.04" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="10 8"/>
    <text x="890" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#2dd4bf" letter-spacing="2">PREVIEW</text>
    <g opacity="0.5">
      <rect x="890" y="166" width="190" height="46" rx="8" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
      <circle cx="910" cy="189" r="6" fill="#2dd4bf"/>
      <rect x="926" y="180" width="100" height="7" rx="3" fill="#cbd5e1"/>
      <rect x="926" y="193" width="60" height="6" rx="3" fill="#f5b041"/>

      <rect x="890" y="224" width="190" height="46" rx="8" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
      <circle cx="910" cy="247" r="6" fill="#f5b041"/>
      <rect x="926" y="238" width="120" height="7" rx="3" fill="#cbd5e1"/>
      <rect x="926" y="251" width="44" height="6" rx="3" fill="#2dd4bf"/>

      <!-- ghost branch -->
      <line x1="910" y1="300" x2="910" y2="388" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 5"/>
      <path d="M910 316 Q910 336 950 340 L1050 340" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="6 5"/>
      <circle cx="910" cy="300" r="7" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="910" cy="388" r="7" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="1056" cy="340" r="7" fill="none" stroke="#2dd4bf" stroke-width="3"/>
    </g>
  </g>

  <!-- arrow + lock between panes -->
  <g>
    <line x1="1108" y1="260" x2="1186" y2="260" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 6"/>
    <path d="M1180 250 L1194 260 L1180 270" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1150" cy="260" r="30" fill="#0f1b2d" stroke="#f5b041" stroke-width="2.5"/>
    <path d="M1140 256 V247 a10 10 0 0 1 20 0 V256" fill="none" stroke="#f5b041" stroke-width="4" stroke-linecap="round"/>
    <rect x="1134" y="255" width="32" height="24" rx="5" fill="#f5b041"/>
    <circle cx="1150" cy="265" r="3.5" fill="#0f1b2d"/>
    <rect x="1148.5" y="266" width="3" height="7" fill="#0f1b2d"/>
  </g>

  <!-- APPLY pane (solid) -->
  <g>
    <rect x="1200" y="110" width="230" height="300" rx="16" fill="#13233a" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="1220" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#f5b041" letter-spacing="2">APPLY</text>

    <rect x="1220" y="166" width="190" height="46" rx="8" fill="#1e3350" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle cx="1240" cy="189" r="6" fill="#2dd4bf"/>
    <rect x="1256" y="180" width="100" height="7" rx="3" fill="#e2e8f0"/>
    <rect x="1256" y="193" width="60" height="6" rx="3" fill="#f5b041"/>
    <path d="M1380 189 l6 6 l12 -12" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1220" y="224" width="190" height="46" rx="8" fill="#1e3350" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle cx="1240" cy="247" r="6" fill="#f5b041"/>
    <rect x="1256" y="238" width="100" height="7" rx="3" fill="#e2e8f0"/>
    <rect x="1256" y="251" width="44" height="6" rx="3" fill="#2dd4bf"/>
    <path d="M1380 247 l6 6 l12 -12" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- merged branch -->
    <line x1="1240" y1="300" x2="1240" y2="388" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M1240 316 Q1240 336 1280 340 L1360 340 Q1390 340 1390 364 L1390 372 Q1390 388 1260 388" fill="none" stroke="#2dd4bf" stroke-width="3"/>
    <circle cx="1240" cy="300" r="7" fill="#e2e8f0"/>
    <circle cx="1240" cy="388" r="8" fill="#2dd4bf"/>
    <circle cx="1360" cy="340" r="7" fill="#2dd4bf"/>
  </g>

  <!-- small gear accent -->
  <g transform="translate(1470 70)" fill="#f5b041" opacity="0.8">
    <circle r="14"/>
    <rect x="-4" y="-22" width="8" height="44" rx="2"/>
    <rect x="-22" y="-4" width="44" height="8" rx="2"/>
    <rect x="-4" y="-22" width="8" height="44" rx="2" transform="rotate(45)"/>
    <rect x="-4" y="-22" width="8" height="44" rx="2" transform="rotate(-45)"/>
    <circle r="6" fill="#172a42"/>
  </g>
</svg>
