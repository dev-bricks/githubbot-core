name: review gate

# Exact-SHA review gate. The privileged jobs run the verifier from the default
# branch only; pull-request code is never checked out, installed or executed.
# Namespace: __GATE_NAMESPACE__ (fixed when this file was scaffolded).
# Repository variable REVIEW_GATE_ALLOWED_SIGNERS_B64: base64 of the OpenSSH
# allowed_signers file with the public keys of the reviewer and owner principals.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  repository_dispatch:
    types: [__GATE_NAMESPACE__-review-gate]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  pending:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Mark the exact pull-request head pending
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_GATE_NAMESPACE: __GATE_NAMESPACE__
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python .github/review-gate/review_gate.py workflow-pending
          --repo "$GATE_REPOSITORY"
          --pr "$GATE_PR_NUMBER"
          --head-sha "$GATE_PR_HEAD_SHA"

  dispatch:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify signed receipt and publish the exact-SHA gate status
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_GATE_NAMESPACE: __GATE_NAMESPACE__
          GATE_REPOSITORY: ${{ github.repository }}
          REVIEW_GATE_RECEIPT_B64: ${{ github.event.client_payload.receipt_b64 }}
          REVIEW_GATE_SIGNATURE_B64: ${{ github.event.client_payload.signature_b64 }}
          REVIEW_GATE_ALLOWED_SIGNERS_B64: ${{ vars.REVIEW_GATE_ALLOWED_SIGNERS_B64 }}
        run: >-
          python .github/review-gate/review_gate.py workflow-dispatch
          --repo "$GATE_REPOSITORY"
